<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS Shop</title>
<style>
  body {
    font-family: -apple-system, "Noto Sans TC", sans-serif;
    background: #1a1a1a;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .box { text-align: center; max-width: 420px; width: 100%; }
  h1 { color: #27ae60; margin-bottom: 4px; }
  .subtitle { color: #999; margin: 0 0 24px; font-size: 14px; }
  .tenant-tag {
    display: inline-block;
    background: #222;
    border: 1px solid #333;
    color: #ffd700;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .msg { background: #222; padding: 20px; border-radius: 8px; margin: 16px 0; line-height: 1.7; }
  .msg.ok { border-left: 4px solid #27ae60; }
  .msg.err { border-left: 4px solid #e74c3c; color: #ff8a80; }
  .msg.info { border-left: 4px solid #3498db; }
  .msg.loading { border-left: 4px solid #f39c12; color: #ffd27d; }
  code { background: #333; padding: 2px 6px; border-radius: 3px; color: #ffd700; }
  .hint { font-size: 13px; color: #888; margin-top: 20px; }
  .menu-btn {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 12px 0;
    text-decoration: none;
    color: white;
    font-size: 17px;
    font-weight: bold;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: transform 0.15s, opacity 0.2s;
    box-sizing: border-box;
    text-align: center;
  }
  .menu-btn:active { transform: scale(0.98); }
  .menu-btn.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }
  .menu-btn .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: normal;
    background: rgba(0,0,0,.3);
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: 2px;
  }
  .btn-shop   { background: linear-gradient(135deg, #2c3e50, #3498db); }
  .btn-office { background: linear-gradient(135deg, #16a085, #2ecc71); }
  .btn-weekly { background: linear-gradient(135deg, #d35400, #f39c12); }
  .btn-roster { background: linear-gradient(135deg, #8e44ad, #9b59b6); }
  .btn-settings { background: linear-gradient(135deg, #34495e, #7f8c8d); }
  .footer { margin-top: 24px; font-size: 12px; color: #666; }
  .entry-form { display: flex; gap: 8px; margin-top: 8px; }
  .entry-form input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #222;
    color: #eee;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  .entry-form input:focus { border-color: #3498db; }
  .entry-form button {
    padding: 12px 20px;
    border-radius: 8px;
    border: 0;
    background: #27ae60;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  .entry-form button:hover { filter: brightness(1.1); }
  .switch-tenant {
    margin-top: 12px;
    background: transparent;
    border: 1px solid #444;
    color: #999;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .switch-tenant:hover { border-color: #666; color: #ccc; }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #444;
    border-top-color: #f39c12;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <h1>☁️ LifeOS Shop</h1>
  <p class="subtitle">多租戶門店管理系統</p>
  <div id="app"></div>
</div>

<script type="module">
  const LAST_TENANT_KEY = 'lifeos_last_tenant';
  const app = document.getElementById('app');
  const setStatus = (html, kind) => {
    app.innerHTML = '<div class="msg ' + (kind || 'info') + '">' + html + '</div>';
  };

  const params = new URLSearchParams(window.location.search);
  const tenantCode = params.get('t');
  const forceInput = params.has('pick'); // ?pick 可強制顯示輸入框（切租戶用）

  const showEntryForm = (prefill) => {
    app.innerHTML =
      '<div class="msg info">' +
        '請輸入租戶代號進入系統' +
        '<form class="entry-form" id="entryForm">' +
          '<input id="tenantInput" type="text" placeholder="例如 demo-qinre-main" value="' + (prefill || '') + '" autocomplete="off" />' +
          '<button type="submit">進入</button>' +
        '</form>' +
      '</div>';
    const form = document.getElementById('entryForm');
    const input = document.getElementById('tenantInput');
    input.focus();
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const code = input.value.trim();
      if (!code) return;
      location.href = '?t=' + encodeURIComponent(code);
    });
  };

  // 系統設定密碼 —— 預設 1357 的 SHA-256
  const DEFAULT_SETTINGS_PWD_HASH = 'f3e055913a0b1eb0f07317896f9a1bc466b9a50db85a7f882f3ffde9ffb23aca';
  async function sha256Hex(str) {
    const bytes = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function renderHome(tenant, settingsPwdHash) {
    const q = '?t=' + encodeURIComponent(tenant.code);
    app.innerHTML =
      '<div class="tenant-tag">🏷 ' + (tenant.name ? (tenant.name + '（' + tenant.code + '）') : tenant.code) + '</div>' +
      '<a href="./shop.html' + q + '" class="menu-btn btn-shop">🏢 門店排班</a>' +
      '<a href="./office.html' + q + '" class="menu-btn btn-office">💰 分紅結算</a>' +
      '<a href="./weekly.html' + q + '" class="menu-btn btn-weekly">📊 週結業績</a>' +
      '<a href="./roster.html' + q + '" class="menu-btn btn-roster">📋 服務資訊排版</a>' +
      '<a href="#" id="openSettings" class="menu-btn btn-settings">⚙️ 系統設定</a>' +
      '<div class="footer">資料已連接租戶 Firebase</div>';
    document.getElementById('openSettings').addEventListener('click', (e) => {
      e.preventDefault();
      renderSettingsPwdForm(tenant, settingsPwdHash);
    });
  }

  function renderSettingsPwdForm(tenant, settingsPwdHash) {
    const q = '?t=' + encodeURIComponent(tenant.code);
    app.innerHTML =
      '<div class="msg info">' +
        '⚙️ 系統設定 — 請輸入密碼' +
        '<div style="font-size:12px;color:#999;margin-top:4px;">忘記密碼請聯繫管理員</div>' +
        '<form class="entry-form" id="pwdForm">' +
          '<input id="pwdInput" type="password" autocomplete="off" />' +
          '<button type="submit">進入</button>' +
        '</form>' +
        '<div id="pwdError" style="color:#e74c3c;font-size:13px;margin-top:6px;min-height:18px;"></div>' +
      '</div>' +
      '<button class="switch-tenant" id="pwdBack">← 返回</button>';
    const form = document.getElementById('pwdForm');
    const input = document.getElementById('pwdInput');
    const errBox = document.getElementById('pwdError');
    input.focus();
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = input.value;
      if (!pwd) return;
      const h = await sha256Hex(pwd);
      if (h === settingsPwdHash) {
        // 一次性 token：settings.html 進頁會消費掉，重整或直接貼 URL 都會被踢回
        try {
          const nonce = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
          sessionStorage.setItem('settings_unlock_token_' + tenant.code, nonce);
        } catch {}
        location.href = './settings.html' + q;
      } else {
        errBox.textContent = '密碼錯誤';
        input.value = '';
        input.focus();
      }
    });
    document.getElementById('pwdBack').addEventListener('click', () => {
      renderHome(tenant, settingsPwdHash);
    });
  }

  if (tenantCode) {
    try {
      setStatus('<span class="spinner"></span>驗證授權中...', 'loading');
      const { bootTenant } = await import('./core/tenant-boot.js');
      const tenant = await bootTenant(msg => setStatus('<span class="spinner"></span>' + msg, 'loading'));

      // 成功載入才存，避免壞代號被記住
      try { localStorage.setItem(LAST_TENANT_KEY, tenantCode); } catch {}

      // 預載 settings 密碼 hash（沒設自訂就用預設 1357）
      let settingsPwdHash = DEFAULT_SETTINGS_PWD_HASH;
      try {
        const { get, ref } = await import('https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js');
        const { mainDb } = await import('./core/main-firebase-config.js');
        const snap = await get(ref(mainDb, 'tenants/' + tenantCode + '/settingsPasswordHash'));
        if (snap.val()) settingsPwdHash = snap.val();
      } catch (e) {
        console.warn('[LifeOS] 讀取 settings 密碼失敗，沿用預設：', e);
      }

      renderHome(tenant, settingsPwdHash);
    } catch (err) {
      console.error('[LifeOS] 啟動失敗', err);
      app.innerHTML =
        '<div class="msg err">❌ ' + (err && err.message ? err.message : '啟動失敗') + '</div>' +
        '<button class="switch-tenant" id="switchBtn">🔄 換別的租戶</button>';
      document.getElementById('switchBtn').addEventListener('click', () => {
        try { localStorage.removeItem(LAST_TENANT_KEY); } catch {}
        location.href = '?pick';
      });
    }
  }
  else {
    // 沒帶 ?t=：一律顯示輸入框（prefill 上次的代號，方便自己快速按 Enter）
    let saved = null;
    try { saved = localStorage.getItem(LAST_TENANT_KEY); } catch {}
    showEntryForm(saved || '');
  }
</script>
</body>
</html>
